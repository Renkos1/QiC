  "@sentry/node": 11.0.0
  "@bull-board/api": 9.10.1
  "@bull-board/express": 9.10.1
  bullmq-otel: 2.0.1
  # ESM loader hook used by OTel instrumentations; pinned so the hook and Hook() share one instance.
  # OTel 插桩使用的 ESM 加载钩子；固定版本以保证钩子与 Hook() 是同一实例。
  import-in-the-middle: 3.5.1

# Dependency lifecycle scripts are opt-in (pnpm blocks unknown ones). 依赖的安装脚本默认禁止，逐个声明。
allowBuilds:
  # testcontainers -> docker-modem -> ssh2: optional native crypto/CPU bindings with JS fallbacks. 可选原生加速，有 JS 回退。
  cpu-features: false
  ssh2: false
  # Postinstall only prints a version notice. 安装脚本只打印版本提示。
  protobufjs: false
  # Postinstall only verifies the platform binary, which is already an optional dependency. 平台二进制已由可选依赖提供。
  esbuild: false
  # Hooks are installed by the root "prepare" script instead. 钩子由根目录 prepare 脚本安装。
  lefthook: false
  # Optional native accelerator for bullmq/msgpackr; prebuilt binaries ship as optional deps and it falls back to JS. 可选原生加速，有 JS 回退。
  msgpackr-extract: false

# Released within pnpm's minimumReleaseAge window at the time of pinning; drop once aged.
# 锁定时仍在 pnpm 最短发布时长窗口内的版本；过了窗口期后从这里删除。
minimumReleaseAgeExclude:
  - lucide-react@1.48.0
  - "@nestjs/common@12.1.0"
  - "@nestjs/core@12.1.0"
  - "@nestjs/platform-express@12.1.0"
  - "@nestjs/testing@12.1.0"
  - '@ai-sdk/anthropic@4.0.65'
  - '@ai-sdk/otel@1.0.116'
  - '@ai-sdk/provider-utils@5.0.49'
  - ai@7.0.116
  - '@ai-sdk/gateway@4.0.94'

peerDependencyRules:
  allowedVersions:
    # Verified working with TS 6 (JS compiler API unchanged); upstream peer range lags. 已验证兼容 TS 6，上游 peer 范围未更新。
    openapi-typescript>typescript: "6"

