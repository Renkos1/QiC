# Single-server production stack; see README.md in this directory.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Only Caddy publishes ports; everything else talks over the internal network.
# Images come from .env.images (written by deploy.sh) so every deploy is pinned by digest.
# Distinct from the dev stack (docker-compose.yml, "qic") so --remove-orphans never touches it.
name: qic-prod

x-app: &app
  restart: unless-stopped
  env_file: [.env.prod]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    <<: *app
    image: ${WEB_IMAGE:-qic-web:local}
    # Next writes its runtime cache here; the rest of the filesystem stays read-only.
    tmpfs: ["/tmp", "/app/apps/web/.next/cache:uid=1000,gid=1000"]
    environment:
      API_ORIGIN: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *app
    image: ${API_IMAGE:-qic-api:local}
    environment:
      DATABASE_URL: postgres://qic:${POSTGRES_PASSWORD}@postgres:5432/qic
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    image: ${WORKER_IMAGE:-qic-worker:local}
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis: { condition: service_healthy }

  # One-shot: applies pending migrations before the api starts (same image as the api).
  migrate:
    <<: *app
    image: ${API_IMAGE:-qic-api:local}
    restart: "no"
    command: ["node", "node_modules/@qic/db/dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://qic:${POSTGRES_PASSWORD}@postgres:5432/qic
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: qic
      POSTGRES_DB: qic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qic -d qic"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.3-alpine@sha256:72cb9be22a83a93d233f434b1c954544b0a8da98a9c600ba95a5a43a6d4d32d4
    restart: unless-stopped
    # noeviction: BullMQ must never lose queued jobs under memory pressure.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
