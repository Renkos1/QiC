# Feature request form: the problem first, the proposal second.
# 需求表单：先描述问题，再给出方案。
name: 需求 / Feature request
description: 提出新功能或改进。Propose a feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 谁在什么场景下遇到了什么问题。Who hits what problem, and when.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives considered
