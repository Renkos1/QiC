# Shared job setup: pinned tools from .mise.toml, cached pnpm store and turbo cache, frozen install.
# 各 job 共用的准备步骤：按 .mise.toml 安装锁定版本的工具，缓存 pnpm store 与 turbo 缓存，按 lockfile 安装依赖。
name: Setup
description: Install the mise tools and the workspace dependencies.
inputs:
  tools:
    # Space-separated mise tools; empty installs everything in .mise.toml. 要安装的 mise 工具（空格分隔），留空安装全部。
    description: mise tools to install
    default: ""
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install_args: ${{ inputs.tools }}

    - name: Locate the pnpm store
      id: pnpm
      shell: bash
      run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    # Turbo's local cache, per job: a hit replays task logs and outputs instead of re-running them.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
