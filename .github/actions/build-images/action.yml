# Builds the api, worker and web images from the repository Dockerfiles into the local Docker
# engine, tagged qic-<app>:<tag>. Layers are cached in the GitHub Actions cache per app.
# 用仓库中的 Dockerfile 构建 api、worker、web 镜像并加载到本机 Docker，标记为 qic-<app>:<tag>；
# 各应用的构建层缓存在 GitHub Actions 缓存中。
# The web build reads NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_OTEL_BROWSER, SENTRY_ORG and SENTRY_PROJECT
# from the calling job's env (set them from repository variables).
# web 构建从调用方 job 的 env 读取 NEXT_PUBLIC_SENTRY_DSN、NEXT_PUBLIC_OTEL_BROWSER、SENTRY_ORG、SENTRY_PROJECT（取自仓库变量）。
name: Build images
description: Build the qic-api, qic-worker and qic-web images.
inputs:
  tag:
    # Local tag for all three images. 三个镜像共用的本地标签。
    description: Image tag
    default: ci
  sentry-auth-token:
    # Uploads web source maps to Sentry when set (releases only). 设置后把 web 的 source map 上传到 Sentry（仅发布时）。
    description: Sentry auth token for the web build
    default: ""
outputs:
  git-sha:
    description: Short commit id baked into the images as GIT_SHA
    value: ${{ steps.meta.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Image metadata
      id: meta
      shell: bash
      # Same 12-character id as tools/docker-build.mjs, so local and CI images report alike.
      run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build qic-api
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: apps/api/Dockerfile
        load: true
        tags: qic-api:${{ inputs.tag }}
        build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
        cache-from: type=gha,scope=qic-api
        cache-to: type=gha,scope=qic-api,mode=max

    - name: Build qic-worker
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: apps/worker/Dockerfile
        load: true
        tags: qic-worker:${{ inputs.tag }}
        build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
        cache-from: type=gha,scope=qic-worker
        cache-to: type=gha,scope=qic-worker,mode=max

    # Browser settings are compiled into the web bundle, so they come from repository variables
    # at build time; the Sentry token is a BuildKit secret and never lands in a layer.
    - name: Build qic-web
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: apps/web/Dockerfile
        load: true
        tags: qic-web:${{ inputs.tag }}
        build-args: |
          GIT_SHA=${{ steps.meta.outputs.sha }}
          NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_OTEL_BROWSER=${{ env.NEXT_PUBLIC_OTEL_BROWSER }}
          SENTRY_ORG=${{ env.SENTRY_ORG }}
          SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
        secrets: |
          sentry_auth_token=${{ inputs.sentry-auth-token }}
        cache-from: type=gha,scope=qic-web
        cache-to: type=gha,scope=qic-web,mode=max
