# Release pipeline. On main, release-please keeps a release PR (version + CHANGELOG) up to date;
# merging it tags a release, and this workflow then builds the images, scans them with Trivy and
# generates SBOMs. Publishing is opt-in through repository settings:
#   IMAGE_REGISTRY set       -> push the images, sign them with cosign (keyless), attach the SBOMs
#   SENTRY_AUTH_TOKEN set    -> upload web source maps for the release
#   AUTO_DEPLOY == "true"    -> hand the pushed digests to deploy.yml
# PRs that touch the image build and manual runs do a dry run: build, scan, SBOM, nothing published.
#
# 发布流水线：main 上由 release-please 维护发布 PR（版本号 + CHANGELOG）；合并后打 tag，随后本流程
# 构建镜像、用 Trivy 扫描并生成 SBOM。发布动作由仓库设置决定：
#   设置 IMAGE_REGISTRY    -> 推送镜像、用 cosign（无密钥）签名并附加 SBOM
#   设置 SENTRY_AUTH_TOKEN -> 上传该版本 web 的 source map
#   AUTO_DEPLOY 为 "true"  -> 把推送得到的 digest 交给 deploy.yml 部署
# 修改镜像构建的 PR 和手动运行只做演练：构建、扫描、生成 SBOM，不发布任何内容。
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/*/Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - .github/actions/build-images/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Compiled into the web bundle at build time (see .github/actions/build-images).
# 构建时编译进 web 前端代码（见 .github/actions/build-images）。
env:
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
  NEXT_PUBLIC_OTEL_BROWSER: ${{ vars.NEXT_PUBLIC_OTEL_BROWSER }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger CI, so the release PR could never pass
      # the required checks; RELEASE_PLEASE_TOKEN (a fine-grained PAT or app token) avoids that.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  images:
    name: images
    needs: release-please
    # release-please is skipped on PRs and manual runs; those still build as a dry run.
    if: ${{ !cancelled() && !failure() && (github.event_name != 'push' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # attach SBOMs and digests to the GitHub release
      packages: write # push when IMAGE_REGISTRY is ghcr.io
      id-token: write # cosign keyless signing
    env:
      RELEASED: ${{ needs.release-please.outputs.created == 'true' }}
      PUBLISH: ${{ needs.release-please.outputs.created == 'true' && vars.IMAGE_REGISTRY != '' }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: build
        uses: ./.github/actions/build-images
        with:
          tag: ci
          sentry-auth-token: ${{ needs.release-please.outputs.created == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}

      # Fixed HIGH/CRITICAL vulnerabilities block the release; unfixed ones have nothing to upgrade to.
      - name: Trivy qic-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qic-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy qic-worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qic-worker:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Trivy qic-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qic-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # sbom-action writes output-file as given and does not create its directory.
      - name: SBOM directory
        run: mkdir -p sbom
      - name: SBOM qic-api
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: qic-api:ci
          format: spdx-json
          output-file: sbom/qic-api.spdx.json
          upload-artifact: false
      - name: SBOM qic-worker
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: qic-worker:ci
          format: spdx-json
          output-file: sbom/qic-worker.spdx.json
          upload-artifact: false
      - name: SBOM qic-web
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: qic-web:ci
          format: spdx-json
          output-file: sbom/qic-web.spdx.json
          upload-artifact: false

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 90

      - name: Image sizes
        run: |
          {
            echo "### Images (${{ steps.build.outputs.git-sha }})"
            echo "| image | size |"
            echo "|---|---|"
            for app in api worker web; do
              bytes=$(docker image inspect "qic-$app:ci" --format '{{.Size}}')
              echo "| qic-$app | $((bytes / 1024 / 1024)) MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach SBOMs to the release
        if: env.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" sbom/*.spdx.json --clobber

      - name: Registry host
        if: env.PUBLISH == 'true'
        id: registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: echo "host=${IMAGE_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      # ghcr.io works with the workflow token; other registries need REGISTRY_USERNAME/REGISTRY_PASSWORD.
      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Deploys reference images by digest (images.env on the release), never by tag.
      - name: Push, sign and attest
        if: env.PUBLISH == 'true'
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          GIT_SHA: ${{ steps.build.outputs.git-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY%/}"
          : > images.env
          for app in api worker web; do
            name="$registry/qic-$app"
            docker tag "qic-$app:ci" "$name:$VERSION"
            docker tag "qic-$app:ci" "$name:sha-$GIT_SHA"
            docker push --all-tags "$name"
            repo_digest=$(docker image inspect "$name:$VERSION" --format '{{index .RepoDigests 0}}')
            ref="$name@${repo_digest#*@}"
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom/qic-$app.spdx.json" "$ref"
            echo "$(echo "$app" | tr '[:lower:]' '[:upper:]')_IMAGE=$ref" >> images.env
          done
          gh release upload "$TAG" images.env --clobber
          { echo "### Published"; echo '```'; cat images.env; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: [release-please, images]
    if: needs.release-please.outputs.created == 'true' && vars.IMAGE_REGISTRY != '' && vars.AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
